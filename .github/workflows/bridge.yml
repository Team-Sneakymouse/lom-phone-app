name: Paper bridge
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and verify
        run: ./gradlew --no-daemon clean build
      - name: Validate runServer task graph without starting Minecraft
        run: ./gradlew --no-daemon runServer --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: lom-phone-bridge
          path: |
            build/libs/lom-phone-bridge-0.1.0.jar
            build/reports/tests/test/
