name: LoMPhoneBridge
version: '${version}'
main: com.lomphone.LoMPhonePlugin
api-version: '26.2'
description: Private phone linking codes and cache-only accepted step totals.
authors: [Team Sneakymouse]
website: https://github.com/Team-Sneakymouse/lom-phone-app
dependencies:
  server:
    SneakyPocketbase:
      load: BEFORE
      required: true
      join-classpath: true
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
permissions:
  lomphone.link:
    description: Create a private phone linking code.
    default: true
